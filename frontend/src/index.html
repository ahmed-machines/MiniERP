<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Mini ERP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link id="bootstrap-css" rel="stylesheet" href="vendor/bootstrap.min.css" data-beasties-skip>
  <script>
    // Apply the saved language before the app boots to avoid an LTR flash for Arabic users.
    (function () {
      var l = localStorage.getItem('minierp.lang');
      if (l === 'ar') {
        document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
        document.getElementById('bootstrap-css').href = 'vendor/bootstrap.rtl.min.css';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
